name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Dependency consistency check
        run: python -m pip check
      - name: Non-isolated packaging dry-run
        run: python -m pip install --no-build-isolation --dry-run .
      - name: Bytecode compilation
        run: python -m compileall -q src tests
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -ra -v
      - name: Build distributions
        run: python -m build
      - name: Verify built distributions
        run: |
          python -c "import glob, tarfile, zipfile; sdist = glob.glob('dist/*.tar.gz')[0]; wheel = glob.glob('dist/*.whl')[0]; snames = tarfile.open(sdist).getnames(); wnames = zipfile.ZipFile(wheel).namelist(); all_names = set(snames) | set(wnames); assert not any('MARKETING-LOG.txt' in n or 'postfach_2026-08-07.txt' in n or 'LOCK' in n.split('/')[-1] for n in all_names), 'Forbidden file in dist'; assert any(n.endswith('LICENSE') for n in snames); assert any(n.endswith('THIRD_PARTY_LICENSES.md') for n in snames); print('dist OK:', len(snames), 'sdist,', len(wnames), 'wheel')"
