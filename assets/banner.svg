<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      
      .title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: -1.5px;
      }
      .subtitle {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        letter-spacing: -0.2px;
      }
      .badge-text {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .pill-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 11.5px;
        letter-spacing: 0.5px;
      }
      .mono-code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
      }
    </style>
    
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0e1a38"/>
      <stop offset="100%" stop-color="#040812"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="300" cy="170" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#070c18" stop-opacity="0"/>
    </radialGradient>
    
  </defs>
  
  
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.2"/>
    <circle cx="300" cy="170" r="260" fill="url(#glow-blue)"/>
    
    <!-- Decision Tree & Crosshair Clicker -->
    <g transform="translate(160, 65)">
      <!-- Decision Tree Branches -->
      <path d="M40 105 L110 55 L190 35" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
      <path d="M110 55 L190 85" stroke="#818cf8" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
      <path d="M40 105 L110 155 L190 135" stroke="#818cf8" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
      <path d="M110 155 L190 175" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
      
      <!-- Nodes -->
      <circle cx="40" cy="105" r="14" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="110" cy="55" r="12" fill="#4338ca" stroke="#818cf8" stroke-width="2"/>
      <circle cx="110" cy="155" r="12" fill="#4338ca" stroke="#818cf8" stroke-width="2"/>
      
      <circle cx="190" cy="35" r="10" fill="#10b981" stroke="#34d399" stroke-width="2"/>
      <circle cx="190" cy="85" r="8" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="190" cy="135" r="8" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="190" cy="175" r="10" fill="#10b981" stroke="#34d399" stroke-width="2"/>
      
      <!-- Clicker / Target Crosshair at active node -->
      <circle cx="110" cy="55" r="22" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
      <!-- Cursor icon -->
      <path d="M110 55 L125 70 L118 73 L124 82 L120 84 L114 75 L108 80 Z" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    </g>
    
  
    <g transform="translate(480, 0)">
      <g transform="translate(0, 58)">
        <rect width="195" height="26" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
        <text x="97" y="17" text-anchor="middle" class="badge-text" fill="#7dd3fc">GOVERNANCE &amp; LOGIC</text>
      </g>
      
      <text x="0" y="142" class="title" font-size="54" fill="url(#title-grad)">Decision-Clicker</text>
      
      <text x="0" y="184" class="subtitle" font-size="20" fill="#e0f2fe">Local Review &amp; Recording for File-Based Decision Chains</text>
      <text x="0" y="210" class="subtitle" font-size="14" fill="#94a3b8" opacity="0.8">Conservative Python library, CLI and mini UI with backups, history and guarded undo.</text>
      
      <g transform="translate(0, 246)">
        <g transform="translate(0, 0)">
          <rect width="150" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="75" y="20" text-anchor="middle" class="pill-text" fill="#bae6fd">Decision Chains</text>
        </g>
        <g transform="translate(162, 0)">
          <rect width="145" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="72" y="20" text-anchor="middle" class="pill-text" fill="#bae6fd">Local CLI &amp; UI</text>
        </g>
        <g transform="translate(319, 0)">
          <rect width="140" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="70" y="20" text-anchor="middle" class="pill-text" fill="#bae6fd">Guarded Writes</text>
        </g>
      </g>
    </g>
    
</svg>
