[project]
name = "decision-clicker"
version = "1.0.1"
description = "Local, conservative UI and CLI for file-based decision chains"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = []
authors = [
  { name = "Lukas Geiger" },
]
keywords = ["decisions", "governance", "local-first", "audit-log"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/decision-clicker"
Repository = "https://github.com/ellmos-ai/decision-clicker"
Issues = "https://github.com/ellmos-ai/decision-clicker/issues"

[project.scripts]
decision-clicker = "decision_clicker.__main__:main"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=9,<10",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/test_server.py" = ["F401"]
